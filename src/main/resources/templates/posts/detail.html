<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿詳細 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>投稿詳細</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
        |
        <a th:href="@{/posts/new}">新規投稿</a>
    </nav>

    <article class="post">
        <header>
            <span class="post__author" th:text="${post.author}">投稿者</span>
            <span class="post__avatar"
                  th:style="|background-color: ${post.avatarColor}|"
                  aria-hidden="true"></span>
            <span class="post__created-at"
                  th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</span>
        </header>
        <p class="post__body">
            <span th:each="part : ${bodyParts}">
                <a th:if="${part.tag}"
                   th:href="@{/tags/{name}(name=${part.tagName})}"
                   th:text="${part.text}">#タグ</a><span th:unless="${part.tag}" th:text="${part.text}">本文</span>
            </span>
        </p>
        <footer class="post__actions">
            <span class="post__like-count" th:text="${likeCount + ' 件'}">0 件</span>
            <form class="post__like-form" th:action="@{/posts/{id}/likes(id=${post.id})}" method="post">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Like</button>
            </form>
            <form class="post__delete-form" th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">削除</button>
            </form>
        </footer>
    </article>
</main>
</body>
</html>
